[package]
name = "gambit-solver"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "WASM wrapper around b-inary/postflop-solver for Gambitracker"

[lib]
crate-type = ["cdylib"]

[dependencies]
# single-threaded: no rayon (needs SharedArrayBuffer), no bincode (no save/load)
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", default-features = false }
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
